[versions]

agp = "9.2.1"
coreKtx = "1.19.0"
coroutines = "1.11.0"
kotlin = "2.4.10"
ksp = "2.3.10"

composeBom = "2026.06.01"
material3 = "1.5.0-alpha24"
androidXActivity = "1.13.0"
androidXBiometric = "1.1.0"
androidXCoreSplashScreen = "1.2.0"
androidXLifecycle = "2.11.0"
androidXNavigation = "2.9.8"
androidXRoom = "2.8.4"
androidXSecurity = "1.1.0"
billing = "9.1.0"
konfetti = "2.0.5"

firebaseBOM = "34.16.0"
firebaseCrashlytics = "3.0.7"

# Hilt library
hiltAndroid = "2.60.1"
hiltAndroidArtifacts = "1.4.0"

# Third Party Libs
sqlCipher = "4.17.0"

# Logging
timberLogs = "5.0.1"

# Testing
coroutinesTest = "1.11.0"
espressoCore = "3.7.0"
junit = "4.13.2"
androidXJUnit = "1.3.0"
mockk = "1.14.11"
turbine = "1.2.1"
googleServices = "4.5.0"

[libraries]
# Core, Kotlin, Coroutines
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

# Pure Androidx
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidXActivity" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidXBiometric" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidXCoreSplashScreen" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidXLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidXLifecycle" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidXNavigation" }

androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidXRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidXRoom" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidXRoom" }

androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "androidXSecurity" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBOM" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
#firebase-ai = { group = "com.google.firebase", name = "firebase-ai" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }

# Billing
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
konfetti-compose = { group = "nl.dionsegijn", name = "konfetti-compose", version.ref = "konfetti" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hiltAndroid" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hiltAndroid" }
androidx-hilt-navigation = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltAndroidArtifacts" }

# Third Party
net-zetetic-sql-cipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlCipher" }
timber-logging = { group = "com.jakewharton.timber", name = "timber", version.ref = "timberLogs" }

# Testing Libraries
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
kotlin-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidXJUnit" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
test-mockk-default = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
test-mockk-agent = { group = "io.mockk", name = "mockk-agent", version.ref = "mockk" }
test-mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
test-cash-turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
hilt-gradle = { id = "com.google.dagger.hilt.android", version.ref = "hiltAndroid" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }